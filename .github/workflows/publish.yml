name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for npm Trusted Publishing (OIDC). No NPM_TOKEN secret needed.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Authenticates via OIDC using the id-token: write permission above.
      # Provenance attestations are generated automatically by Trusted Publishing.
      - name: Publish to npm
        run: npm publish --access public
